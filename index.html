<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria — AI Chat</title>
    <meta
      name="description"
      content="Aria is a ChatGPT-style AI chat demo with streaming replies, chat history, and multi-turn conversation memory."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="sidebar-top">
          <button class="new-chat" id="new-chat" type="button">+ New chat</button>
          <button class="icon-btn close-sidebar" id="close-sidebar" type="button" aria-label="Close sidebar">
            ✕
          </button>
        </div>
        <div class="chat-list" id="chat-list"></div>
        <div class="sidebar-foot">
          <p class="brand-mini">Aria</p>
          <p class="fineprint">ChatGPT-style demo · local AI · unofficial</p>
        </div>
      </aside>

      <div class="backdrop" id="backdrop" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="open-sidebar" type="button" aria-label="Open sidebar">
            ☰
          </button>
          <div class="model-pill" title="Local demo model">
            <span class="dot"></span>
            Aria 1.0
          </div>
        </header>

        <section class="thread" id="thread" aria-live="polite"></section>

        <section class="empty" id="empty">
          <p class="empty-brand">Aria</p>
          <h1>How can I help you today?</h1>
          <div class="starter-grid">
            <button type="button" data-starter="Explain quantum computing in simple terms.">
              Explain quantum computing simply
            </button>
            <button type="button" data-starter="Write a short friendly email asking for project feedback.">
              Draft a feedback email
            </button>
            <button type="button" data-starter="Give me a 3-day workout plan for beginners at home.">
              Beginner home workout plan
            </button>
            <button type="button" data-starter="Help me brainstorm names for a coffee shop.">
              Brainstorm coffee shop names
            </button>
          </div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-box">
            <label class="sr-only" for="prompt">Message Aria</label>
            <textarea
              id="prompt"
              rows="1"
              placeholder="Message Aria…"
              maxlength="4000"
            ></textarea>
            <button class="send" id="send" type="submit" aria-label="Send message">
              ↑
            </button>
          </div>
          <p class="disclaimer">
            Aria can make mistakes. This is a local demo inspired by ChatGPT — not affiliated with OpenAI.
          </p>
        </form>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
